syntax = "proto3";

package helloworld;

option go_package = "example.com/cuit-go-frameworks/grpc-demo/proto;helloworldpb";

service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
  int64 server_time = 2;
}
